<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#007aff"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Robô de Ofertas"
    >

    <title>Robô de Ofertas</title>

    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<main class="app">

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header>

        <h1>
            🤖 Robô de Ofertas
        </h1>

        <p>
            Encontre ofertas do Mercado Livre
        </p>

    </header>


    <!-- =====================================================
         CONEXÃO MERCADO LIVRE
    ====================================================== -->

    <section class="conexao">

        <div
            id="statusMercadoLivre"
            class="status desconectado"
        >
            ⏳ Verificando conexão...
        </div>


        <a
            id="botaoConectar"
            class="botao conectar"
            href="/auth/mercadolivre"
        >
            🔗 Conectar Mercado Livre
        </a>


        <a
            id="botaoDesconectar"
            class="botao"
            href="/auth/mercadolivre/logout"
            style="display:none;"
        >
            🔓 Desconectar
        </a>

    </section>


    <!-- =====================================================
         BUSCA
    ====================================================== -->

    <section class="busca">

        <input
            id="produto"
            type="search"
            placeholder="Digite um produto..."
            autocomplete="off"
        >

        <button
            id="botaoBuscar"
            type="button"
            onclick="buscar()"
        >
            🔎 Buscar
        </button>

    </section>


    <div id="status"></div>


    <section
        id="resultado"
        class="resultado"
    ></section>

</main>


<script>


// ============================================================
// SERVICE WORKER
// ============================================================

if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register(
                    "/static/service-worker.js"
                )
                .catch(
                    function(erro) {

                        console.log(
                            "Service Worker:",
                            erro
                        );

                    }
                );

        }
    );

}


// ============================================================
// VERIFICAR MERCADO LIVRE
// ============================================================

async function verificarMercadoLivre() {

    const status =
        document.getElementById(
            "statusMercadoLivre"
        );

    const conectar =
        document.getElementById(
            "botaoConectar"
        );

    const desconectar =
        document.getElementById(
            "botaoDesconectar"
        );

    try {

        const resposta =
            await fetch(
                "/api/auth/status",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        const dados =
            await resposta.json();


        if (
            dados
            &&
            dados.conectado
        ) {

            status.className =
                "status conectado";

            status.innerHTML =
                "🟢 Mercado Livre conectado";

            conectar.style.display =
                "none";

            desconectar.style.display =
                "inline-block";

        }
        else {

            status.className =
                "status desconectado";

            status.innerHTML =
                "🔴 Mercado Livre não conectado";

            conectar.style.display =
                "inline-block";

            desconectar.style.display =
                "none";

        }

    }
    catch (erro) {

        console.error(
            "Erro verificando Mercado Livre:",
            erro
        );

        status.className =
            "status desconectado";

        status.innerHTML =
            "⚠️ Não foi possível verificar a conexão";

        conectar.style.display =
            "inline-block";

        desconectar.style.display =
            "none";

    }

}


// ============================================================
// BUSCAR
// ============================================================

async function buscar() {

    const campo =
        document.getElementById(
            "produto"
        );

    const botao =
        document.getElementById(
            "botaoBuscar"
        );

    const status =
        document.getElementById(
            "status"
        );

    const resultado =
        document.getElementById(
            "resultado"
        );

    const termo =
        campo.value.trim();


    if (!termo) {

        status.innerHTML =
            "⚠️ Digite um produto.";

        return;

    }


    botao.disabled =
        true;

    botao.innerText =
        "🔎 Buscando...";

    resultado.innerHTML =
        "";

    status.innerHTML =
        "⏳ Procurando ofertas...";


    try {

        const resposta =
            await fetch(
                "/api/buscar?produto="
                +
                encodeURIComponent(
                    termo
                )
                +
                "&limite=20",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        let dados = {};

        try {

            dados =
                await resposta.json();

        }
        catch {

            dados = {};

        }


        if (!resposta.ok) {

            throw new Error(
                dados.mensagem
                ||
                dados.erro
                ||
                "Erro na busca."
            );

        }


        const produtos =
            Array.isArray(
                dados.produtos
            )
            ?
            dados.produtos
            :
            [];


        if (
            produtos.length === 0
        ) {

            status.innerHTML =
                "❌ Nenhuma oferta encontrada para <b>"
                +
                escapar(
                    termo
                )
                +
                "</b>.";

            return;

        }


        status.innerHTML =
            "✅ "
            +
            produtos.length
            +
            " ofertas encontradas.";


        produtos.forEach(
            function(produto) {

                criarCard(
                    produto,
                    resultado
                );

            }
        );

    }
    catch (erro) {

        console.error(
            erro
        );

        status.innerHTML =
            "❌ Erro: "
            +
            escapar(
                erro.message
            );

    }
    finally {

        botao.disabled =
            false;

        botao.innerText =
            "🔎 Buscar";

    }

}


// ============================================================
// CARD DO PRODUTO
// ============================================================

function criarCard(
    produto,
    area
) {

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "produto";


    const titulo =
        produto.titulo
        ||
        produto.title
        ||
        "Produto";


    const imagem =
        produto.imagem
        ||
        produto.thumbnail
        ||
        "";


    const preco =
        produto.preco_formatado
        ||
        formatarPreco(
            produto.preco
            ||
            produto.price
        );


    const revenda =
        produto.revenda_formatada
        ||
        produto.preco_revenda_formatado
        ||
        formatarPreco(
            produto.revenda
            ||
            produto.preco_revenda
        );


    const lucro =
        produto.lucro_formatado
        ||
        formatarPreco(
            produto.lucro
        );


    const link =
        produto.link
        ||
        produto.permalink
        ||
        "#";


    card.innerHTML = `

        ${
            imagem
            ?
            `
            <img
                src="${escapar(imagem)}"
                alt="${escapar(titulo)}"
                loading="lazy"
            >
            `
            :
            ""
        }

        <h2>
            ${escapar(titulo)}
        </h2>

        <p>
            💰 Preço:
            <strong>
                ${escapar(preco)}
            </strong>
        </p>

        ${
            revenda !== "R$ 0,00"
            ?
            `
            <p>
                🏷️ Revenda:
                <strong>
                    ${escapar(revenda)}
                </strong>
            </p>
            `
            :
            ""
        }

        ${
            lucro !== "R$ 0,00"
            ?
            `
            <p>
                📈 Lucro estimado:
                <strong>
                    ${escapar(lucro)}
                </strong>
            </p>
            `
            :
            ""
        }

        <a
            class="produto-link"
            href="${escapar(link)}"
            target="_blank"
            rel="noopener noreferrer"
        >
            🛒 Ver produto
        </a>

        <button
            type="button"
            class="compartilhar"
        >
            📲 Compartilhar
        </button>

    `;


    const compartilharBotao =
        card.querySelector(
            ".compartilhar"
        );


    compartilharBotao.addEventListener(
        "click",
        function() {

            compartilhar(
                titulo,
                link
            );

        }
    );


    area.appendChild(
        card
    );

}


// ============================================================
// COMPARTILHAR
// ============================================================

async function compartilhar(
    titulo,
    link
) {

    try {

        if (
            navigator.share
        ) {

            await navigator.share({

                title:
                    titulo,

                text:
                    "🔥 Confira esta oferta!",

                url:
                    link

            });

            return;

        }


        if (
            navigator.clipboard
        ) {

            await navigator.clipboard.writeText(
                link
            );

            alert(
                "Link copiado!"
            );

            return;

        }


        alert(
            "Não foi possível copiar o link."
        );

    }
    catch (erro) {

        console.log(
            erro
        );

    }

}


// ============================================================
// ENTER
// ============================================================

document
    .getElementById(
        "produto"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                buscar();

            }

        }
    );


// ============================================================
// FORMATAÇÃO DE PREÇO
// ============================================================

function formatarPreco(
    valor
) {

    const numero =
        Number(
            valor || 0
        );


    if (
        !Number.isFinite(
            numero
        )
    ) {

        return "R$ 0,00";

    }


    return numero.toLocaleString(
        "pt-BR",
        {
            style:
                "currency",

            currency:
                "BRL"
        }
    );

}


// ============================================================
// ESCAPAR HTML
// ============================================================

function escapar(
    valor
) {

    return String(
        valor || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


// ============================================================
// INICIALIZAÇÃO
// ============================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        verificarMercadoLivre();

    }
);

</script>

</body>

</html>
